<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autonomous Audit | Protótipo do TCC</title>
<style>
:root{--forest:#10233e;--navy:#152d48;--ink:#1d2c42;--muted:#758093;--line:#dce1e9;--paper:#f7f8fb;--red:#ae3446}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:10px 15px}
button:hover{background:#eef3f9}
button.primary,button.primary-button{background:var(--forest);color:#fff;border-color:var(--forest)}
button.primary:hover,button.primary-button:hover{background:#1a3658}
button.danger,button.danger-button{color:#a52539;border-color:#e3b4bc;background:#fff}
button.danger:hover,button.danger-button:hover{background:#fff0f0}
button.ghost,button.ghost-button{background:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--forest)}
.meta{min-height:42px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 25px;background:#e5ecf2;color:#354960;font-size:12px}
.meta button{font-size:12px;padding:4px 10px}
header.top{height:86px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 30px}
.brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:800;letter-spacing:-.5px;color:var(--forest);text-decoration:none}
.brand small{display:block;font-weight:400;font-size:11px;letter-spacing:4px}
.brand img{width:40px;height:40px}
.user-menu{position:relative}
.user-menu-trigger{display:flex;align-items:center;gap:12px;background:transparent;border:1px solid transparent;border-radius:12px;padding:4px 8px 4px 4px;max-width:min(420px,52vw);text-align:left}
.user-menu-trigger:hover,.user-menu-trigger[aria-expanded="true"]{background:#fff;border-color:var(--line)}
.avatar{border-radius:50%;background:var(--forest);color:#fff;width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto}
.user-copy strong{display:block}
.user-copy span{display:block;color:var(--muted);font-size:13px}
.caret{color:#becbdd;font-size:12px}
.user-menu-panel{position:absolute;right:0;top:calc(100% + 8px);min-width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px #10233e24;padding:8px;z-index:30}
.user-menu-panel a,.user-menu-panel button{display:block;width:100%;background:transparent;border:0;border-radius:8px;text-align:left;text-decoration:none;padding:10px 12px;color:var(--ink)}
.user-menu-panel a:hover,.user-menu-panel button:hover{background:#eef3f9}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 128px)}
nav{background:#fff;padding:28px 15px;border-right:1px solid var(--line)}
nav a{display:block;padding:13px 14px;margin-bottom:7px;border-radius:8px;color:#53657a;text-decoration:none;font-weight:600}
nav a.active{background:var(--forest);color:#fff}
nav a:hover:not(.active){background:#e5ebf0;color:#152d48}
main{padding:33px 37px;max-width:1500px;min-width:0}
.kicker{letter-spacing:2px;font-size:11px;font-weight:bold;color:#708195}
h1{font-size:29px;font-weight:600;margin:6px 0 18px}
h2{font-size:20px;margin:0 0 16px}
h3{font-size:16px;margin:18px 0 8px}
.toolbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 20px}
.toolbar.right{justify-content:space-between;align-items:center}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:25px;margin-bottom:22px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:18px}
.kpi-grid.three{grid-template-columns:repeat(3,1fr)}
.kpi{padding:24px;border:1px solid var(--line);border-radius:12px;background:#fff;text-decoration:none;color:inherit;display:block}
.kpi span{color:var(--muted)}
.kpi strong{font-size:29px;display:block;margin-top:9px}
.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.4px;color:#5c6e80;background:#edf2f6}
td,th{border-bottom:1px solid var(--line);padding:12px 14px;vertical-align:middle}
.table-scroll{overflow:auto;margin-bottom:22px}
.badge{background:#e0f1e8;color:#28744c;font-size:12px;border-radius:20px;padding:5px 10px;white-space:nowrap}
.badge.wait{background:#fff1d6;color:#886022}
.badge.fail{background:#fde8ea;color:#9f2439}
.upload{border:2px dashed #9cabb9;border-radius:10px;padding:24px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
label{display:block;font-size:13px;font-weight:600}
input,select,textarea{display:block;width:100%;padding:10px 12px;border:1px solid #bac7d1;border-radius:6px;background:#fff;color:var(--ink);margin:5px 0 0}
.success{background:#e7f2ec;border:1px solid #bcddc9;color:#256742;padding:12px;border-radius:7px}
.error{color:#9f2439;background:#fff0f0;padding:11px;border-radius:7px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);margin:0 0 20px}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;border-radius:0;padding:10px 4px}
.tab.active,.tab.is-active{color:var(--forest);border-bottom-color:var(--forest)}
dialog{border:1px solid #c5d0d9;border-radius:14px;width:min(1080px,calc(100vw - 48px));max-height:calc(100vh - 32px);overflow:auto;padding:30px;color:var(--ink)}
dialog::backdrop{background:#0c233d66}
.close{float:right;border:0;padding:0 10px;font-size:25px;background:transparent}
#notice:empty{display:none}
#notice{margin-bottom:18px}
footer.note{color:#647589;font-size:12px;margin-top:30px}
.wire{--forest:#4a4a4a;--navy:#4a4a4a;--ink:#222;--muted:#555;--line:#999;--paper:#fff;filter:grayscale(1)}
.wire .panel,.wire .kpi,.wire button,.wire nav a,.wire input,.wire select,.wire dialog{border-radius:0}
.login-wrap{max-width:520px;margin:40px auto}
.cadastro-toolbar{display:flex;flex-wrap:nowrap;align-items:flex-end;justify-content:space-between;gap:16px}
.cadastro-busca{width:50%;flex:0 0 50%;min-width:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.icone-abrir,.icone-salvar{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--forest)}
.icone-salvar:disabled{color:var(--muted);opacity:.45}
.icone-abrir svg,.icone-salvar svg{width:22px;height:22px}
.fornecedor-celula select{min-width:180px;max-width:280px;min-height:36px;margin:0}
.acoes-linha,.acoes-cadastro,.produto-nome-linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.produto-nome-linha{justify-content:space-between}
.produto-grupo-nome td{border-bottom:0;padding-bottom:4px;font-weight:600}
.produto-grupo-dados td{color:#53657a}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.qr-box{width:180px;height:180px;border:8px solid var(--forest);display:grid;place-items:center;font-size:12px;text-align:center;color:var(--muted);background:repeating-linear-gradient(90deg,#10233e 0 8px,#fff 8px 16px),repeating-linear-gradient(#10233e 0 8px,#fff 8px 16px);background-size:16px 16px}
.campo-lookup{display:flex;gap:8px;align-items:end}
.campo-lookup input{flex:1}
.armazenamento{display:flex;gap:24px;align-items:center}
.rosca{width:120px;height:120px}
.empty{padding:28px;text-align:center;color:#647589}
.file-list{padding-left:20px}
.file-list li{display:flex;justify-content:space-between;gap:12px;margin:6px 0}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  nav{display:flex;overflow:auto;padding:10px}
  nav a{white-space:nowrap;margin:0;font-size:12px}
  main{padding:20px}
  .kpi-grid,.kpi-grid.three,.split,.row{grid-template-columns:1fr}
  header.top{padding:0 15px}
  .cadastro-toolbar{flex-wrap:wrap}
  .cadastro-busca{width:100%;flex-basis:100%}
  .user-copy span{display:none}
}
</style>
</head>
<body>
<div class="meta">
  <span>PROTÓTIPO ACADÊMICO · Dados fictícios · Ações simuladas, sem conexão com a API</span>
  <div><button type="button" id="wire">Wireframe</button> <button type="button" id="reset">Reiniciar dados</button></div>
</div>
<div id="app"></div>
<dialog id="editor">
  <button class="close" type="button" aria-label="Fechar" onclick="fecharModal()">×</button>
  <h2 id="modal-title"></h2>
  <p class="muted" id="modal-help"></p>
  <div id="modal-body"></div>
</dialog>
<script>
const ICONE_RECIBO = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3.5h10a1.2 1.2 0 0 1 1.2 1.2V20l-2.1-1.2-2.1 1.2-2-1.2-2 1.2-2.1-1.2-2.1 1.2V4.7A1.2 1.2 0 0 1 7 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 8h6M9 11.5h6M9 15h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
const ICONE_SALVAR = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5.5A1.5 1.5 0 0 1 6.5 4h9.2L19 7.3V18.5A1.5 1.5 0 0 1 17.5 20h-11A1.5 1.5 0 0 1 5 18.5v-13Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 4.5V9h8V4.5M8 20v-6h8v6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
const NAV = [
  ['dashboard','Indicadores'],
  ['novo','Adicionar Recibo / NF'],
  ['recibos','Listar Recibo / NF'],
  ['compras','Compras'],
  ['fornecedores','Fornecedores / Prestadores'],
  ['produtos','Produtos/Serviços'],
  ['relatorios','Relatório']
];
const CONFIRMA_EXCLUSAO_RECIBO = 'Excluir este recibo/NF e os dados vinculados (compra, itens, arquivos e produtos/serviços deste documento)? Se o fornecedor não tiver outros recibos, ele também será excluído. Esta ação não pode ser desfeita.';
const initial = {
  usuario: {nome:'Avaliador', email:'avaliador@example.com'},
  fornecedores: [
    {id:'FOR001', codigo:'42C6F612', nome:'Supermercado Pizzol Ltda – EPP', razao:'Supermercado Pizzol Ltda – EPP', documento:'11.222.333/0001-44', telefone:'(11) 4000-0000', cep:'01001-000', endereco:'Rua das Flores, 100 – São Paulo/SP', vinculado:true},
    {id:'FOR002', codigo:'BCFCFBCE', nome:'Google Cloud Brasil', razao:'Google Cloud Brasil Computação e Serviços de Dados Ltda', documento:'25.012.398/0001-07', telefone:'', cep:'04543-000', endereco:'São Paulo/SP', vinculado:true},
    {id:'FOR003', codigo:'8E3A68C7', nome:'Alexandre Novaes Iosimura Tecnologia-ME', razao:'Alexandre Novaes Iosimura Tecnologia-ME', documento:'26.994.686/0001-77', telefone:'', cep:'', endereco:'', vinculado:false}
  ],
  produtos: [
    {id:'PRO001', codigo:'F94235B2', nome:'Pão Francês KG', unidade:'kg', valor:7.95, liquido:7.95, reciboId:'REC001', marca:'Padaria', vinculado:true},
    {id:'PRO002', codigo:'73B5BACE', nome:'Conjunto c/6 copos Lights L.Drink 300 ml', unidade:'un', valor:29.9, liquido:29.9, reciboId:'REC002', marca:'Lights', vinculado:true}
  ],
  servicos: [
    {id:'SER001', codigo:'51448333', nome:'Serviços de hospedagem, armazenamento e processamento de dados', unidade:'un', valor:195.5, liquido:195.5, reciboId:'REC003', vinculado:true},
    {id:'SER002', codigo:'2876C051', nome:'Suporte técnico, instalação e manutenção', unidade:'h', valor:180, liquido:180, reciboId:'', vinculado:false}
  ],
  recibos: [
    {id:'REC001', codigo:'1FC18525', data:'07/10/2026', dataCompra:'07/10/2026', arquivo:'recibo-pao.pdf', status:'Processado', total:7.95, subtotal:7.95, descontos:0, acrescimos:0, fornecedorId:'FOR001', tipoDoc:'Recibo', tipoItem:'Produto', extracao:'Dados extraídos.', paginas:1, pagamento:'Pix', telefone:'(11) 4000-0000', endereco:'Rua das Flores, 100'},
    {id:'REC002', codigo:'03BBC408', data:'06/10/2026', dataCompra:'06/10/2026', arquivo:'nf-98965.pdf', status:'Processado', total:29.9, subtotal:29.9, descontos:0, acrescimos:0, fornecedorId:'FOR001', tipoDoc:'Nota fiscal', tipoItem:'Produto', extracao:'Dados extraídos.', paginas:1, pagamento:'Cartão', telefone:'(11) 4000-0000', endereco:'Rua das Flores, 100'},
    {id:'REC003', codigo:'52D94F9B', data:'05/10/2026', dataCompra:'05/10/2026', arquivo:'nfe-19505089.pdf', status:'Processado', total:195.5, subtotal:195.5, descontos:0, acrescimos:0, fornecedorId:'FOR002', tipoDoc:'Nota fiscal', tipoItem:'Serviço', extracao:'Dados extraídos.', paginas:2, pagamento:'Boleto', telefone:'', endereco:'São Paulo/SP'}
  ]
};
let db = JSON.parse(JSON.stringify(initial));
let route = 'dashboard';
let tipoLista = 'produtos';
let abaFornecedor = 'dados';
let abaProduto = 'identificacao';
let abaConfig = 'perfil';
let editing = null;
let edicoesFornecedor = {};
let arquivosLocais = [];
let qrVisivel = false;
let tokenApi = '';
let filtroCadastro = '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => Number(v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const el = id => document.getElementById(id);
function notice(t, error) {
  const box = el('notice');
  if (!box) return;
  box.innerHTML = t ? `<div class="${error ? 'error' : 'success'}">${esc(t)}</div>` : '';
}
function go(r) {
  location.hash = r;
}
function fornecedor(id) {
  return db.fornecedores.find(f => f.id === id);
}
function recibo(id) {
  return db.recibos.find(r => r.id === id);
}
function qtdRecibos(fid) {
  return db.recibos.filter(r => r.fornecedorId === fid).length;
}
function badge(status) {
  const cls = status === 'Processando' ? 'wait' : status.includes('Falha') ? 'fail' : '';
  return `<span class="badge ${cls}">${esc(status)}</span>`;
}
function iconeAbrir(id) {
  return `<button class="icone-abrir" type="button" title="Visualizar recibo / NF" aria-label="Visualizar ${id}" onclick="detail('${id}')">${ICONE_RECIBO}</button>`;
}
function table(headers, rows, extra='') {
  return `<div class="table-scroll"><table ${extra}><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${headers.length}" class="empty">Nenhum registro encontrado.</td></tr>`}</tbody></table></div>`;
}
function shell(title, body) {
  const logado = route !== 'login';
  if (!logado) {
    return `<main><div class="login-wrap">${body}<footer class="note">Projeto Integrado · Alexandre Novaes Iosimura</footer></div></main>`;
  }
  return `<header class="top">
    <a class="brand" href="#dashboard"><img src="favicon.svg" alt=""><span>canada<small>software</small></span></a>
    <div class="user-menu" id="user-menu">
      <button class="user-menu-trigger" type="button" aria-haspopup="menu" aria-expanded="false" id="user-trigger">
        <span class="avatar">A</span>
        <div class="user-copy"><strong>${esc(db.usuario.nome)}</strong><span>${esc(db.usuario.email)}</span></div>
        <span class="caret" aria-hidden="true">▾</span>
      </button>
      <div class="user-menu-panel" id="user-panel" hidden role="menu">
        <a href="#configuracoes" role="menuitem">Configurações</a>
        <button type="button" role="menuitem" id="sair">Sair</button>
      </div>
    </div>
  </header>
  <div class="shell">
    <nav>${NAV.map(([id,label]) => `<a href="#${id}" class="${route===id?'active':''}">${label}</a>`).join('')}</nav>
    <main>
      <div class="kicker">AUTONOMOUS AUDIT</div>
      <h1>${title}</h1>
      <div id="notice" role="status"></div>
      ${body}
      <footer class="note">Projeto Integrado · Alexandre Novaes Iosimura · Navegação alinhada à aplicação publicada</footer>
    </main>
  </div>`;
}
function renderDashboard() {
  const processados = db.recibos.filter(r => r.status === 'Processado').length;
  const processando = db.recibos.filter(r => r.status === 'Processando').length;
  const falhas = db.recibos.filter(r => r.status.includes('Falha')).length;
  const total = db.recibos.reduce((s,r) => s + r.total, 0);
  const porForn = db.fornecedores.map(f => {
    const rs = db.recibos.filter(r => r.fornecedorId === f.id);
    return {nome:f.nome, qtd:rs.length, total:rs.reduce((s,r)=>s+r.total,0)};
  }).filter(x => x.qtd);
  return shell('Indicadores de uso', `
    <p>Dados extraídos dos documentos de operações realizadas : compras, notas fiscais e recibos.</p>
    <div class="toolbar">
      <label>Tipo Data<select id="mes"><option>Outubro</option><option>Setembro</option></select></label>
      <label>Ano<select id="ano"><option>2026</option><option>2025</option></select></label>
    </div>
    <div class="kpi-grid">
      <a class="kpi" href="#recibos"><span>Recibos</span><strong>${db.recibos.length}</strong></a>
      <a class="kpi" href="#recibos"><span>Processados</span><strong>${processados}</strong></a>
      <div class="kpi"><span>Processando</span><strong>${processando}</strong></div>
      <div class="kpi"><span>Total extraído</span><strong>${brl(total)}</strong></div>
    </div>
    <div class="kpi-grid three">
      <a class="kpi" href="#recibos"><span>Falhas</span><strong>${falhas}</strong></a>
      <div class="kpi"><span>Tokens utilizados</span><strong>12.480</strong></div>
      <div class="kpi"><span>Custo IA</span><strong>R$ 0,42</strong></div>
    </div>
    <section class="panel">
      <h2>Armazenamento</h2>
      <div class="armazenamento">
        <svg class="rosca" viewBox="0 0 140 140" role="img" aria-label="Uso de armazenamento 12%">
          <circle cx="70" cy="70" r="54" fill="none" stroke="#e7edf2" stroke-width="12"/>
          <circle cx="70" cy="70" r="54" fill="none" stroke="#10233e" stroke-width="12" stroke-dasharray="40 339" stroke-linecap="round" transform="rotate(-90 70 70)"/>
          <text x="70" y="76" text-anchor="middle" font-size="18" font-weight="700">12%</text>
        </svg>
        <div>
          <p><strong>128 MB de 1,00 GB</strong></p>
          <p class="muted">Restam 896 MB para novos documentos.</p>
        </div>
      </div>
    </section>
    <section class="panel">
      <h2>Por fornecedor / prestador</h2>
      ${table(['Fornecedor / Prestador','Recibos','Total'], porForn.map(l => [esc(l.nome), l.qtd, brl(l.total)]))}
    </section>`);
}
function renderNovo() {
  const lista = arquivosLocais.map((n,i) => `<li><span>${esc(n)}</span><button type="button" onclick="removerArquivo(${i})">Remover</button></li>`).join('');
  return shell('Adicionar Recibo / NF', `
    <p>Envie uma ou mais imagens, ou um PDF (até 50 MB cada). PDF, JPG, PNG ou WebP. Cada imagem é analisada como uma compra; se o mesmo documento ocupar mais de uma foto, o reconhecimento agrupa essas páginas.</p>
    <div class="split">
      <section class="panel">
        <h2>Arquivos</h2>
        <div class="upload">
          <input id="files" type="file" accept="application/pdf,image/jpeg,image/png,image/webp" multiple>
        </div>
        <ul id="file-list" class="file-list">${lista}</ul>
        <button class="primary" type="button" id="enviar" ${arquivosLocais.length? '' : 'disabled'}>Enviar recibo</button>
      </section>
      <section class="panel">
        <h2>Captura no celular</h2>
        ${qrVisivel ? `<div class="qr-box">QR de demonstração</div><p class="muted">Aguardando o celular. 0 foto(s) recebida(s).</p>` : `<button class="ghost" type="button" id="gerar-qr">Gerar QR</button>`}
      </section>
    </div>`);
}
function renderRecibos() {
  const rows = db.recibos.map(r => {
    const sel = edicoesFornecedor[r.id] ?? r.fornecedorId ?? '';
    const mudou = sel && sel !== (r.fornecedorId ?? '');
    const opts = [`<option value="">Selecionar…</option>`]
      .concat(db.fornecedores.map(f => `<option value="${f.id}" ${sel===f.id?'selected':''}>${esc(f.nome)}</option>`)).join('');
    return [
      iconeAbrir(r.id),
      `<a href="#recibos" onclick="detail('${r.id}');return false;">${r.data}</a>`,
      `<a href="#recibos" onclick="detail('${r.id}');return false;">${r.codigo}</a>`,
      `<div class="fornecedor-celula"><select aria-label="Fornecedor do recibo ${r.codigo}" onchange="editarFornecedor('${r.id}', this.value)">${opts}</select></div>`,
      `${esc(r.tipoDoc)} · ${esc(r.tipoItem)}`,
      brl(r.total),
      badge(r.status),
      esc(r.extracao),
      `<div class="acoes-linha">
        <button class="icone-salvar" type="button" ${mudou?'':'disabled'} title="Salvar fornecedor" aria-label="Salvar fornecedor do recibo ${r.codigo}" onclick="salvarFornecedor('${r.id}')">${ICONE_SALVAR}</button>

function ligar() {

  const panel = el('user-panel');
  if (trigger && panel) {
    trigger.onclick = () => {
      const aberto = !panel.hidden;
      panel.hidden = aberto;
      trigger.setAttribute('aria-expanded', String(!aberto));
    };
    el('sair').onclick = () => go('login');

  const busca = el('catalog-search');

      alvos.forEach(tr => {
        tr.hidden = Boolean(q && !tr.innerText.toLocaleLowerCase('pt-BR').includes(q));
      });
    };
  }
  if (el('files')) {
    el('files').onchange = () => {
      arquivosLocais = [...el('files').files].map(f => f.name);
      render();

  }
  if (el('enviar')) el('enviar').onclick = processFiles;

  if (el('relatorio-form')) {
    el('relatorio-form').onsubmit = e => { e.preventDefault(); notice('Consulta demonstrativa atualizada.'); };
    el('csv').onclick = csv;
    el('xlsx').onclick = () => notice('A exportação Excel está prevista na aplicação. Neste protótipo, utilize CSV.');
    el('curl').onclick = () => {

      el('editor').showModal();
    };
  }
  if (el('login')) el('login').onsubmit = e => { e.preventDefault(); go('dashboard'); };
  if (el('perfil-form')) el('perfil-form').onsubmit = e => {
    e.preventDefault();
    db.usuario.nome = e.target.nome.value.trim() || db.usuario.nome;

    render();
  };
  if (el('buscar-cep')) el('buscar-cep').onclick = () => notice('Endereço preenchido pelo CEP. Confira antes de salvar.');
  if (el('gerar-token')) el('gerar-token').onclick = () => { tokenApi = 'aa_demo_' + String(Date.now()).slice(-8); render(); notice('Token gerado na demonstração.'); };
  if (el('copiar-token')) el('copiar-token').onclick = () => notice('Token copiado na demonstração.');
}

  if (!r || !novo || novo === r.fornecedorId) return;

function excluirRecibo(id) {

  const r = recibo(id);
  db.recibos = db.recibos.filter(x => x.id !== id);
  db.produtos = db.produtos.filter(p => p.reciboId !== id);
  db.servicos = db.servicos.filter(p => p.reciboId !== id);
  if (r?.fornecedorId && qtdRecibos(r.fornecedorId) === 0) {
    db.fornecedores = db.fornecedores.filter(f => f.id !== r.fornecedorId);
  }

function salvarCadastro(e) {
  e.preventDefault();
  if (!editing) return;
  const form = Object.fromEntries(new FormData(e.target));
  if (!form.nome?.trim()) {
    el('form-error').innerHTML = '<p class="error">Informe o nome.</p>';
    return;
  }
  const {t, id} = editing;
  if (id) {
    db[t] = db[t].map(x => x.id === id ? {...x, ...form, reciboId: form.recibo || x.reciboId} : x);
  } else {
    const prefix = t === 'fornecedores' ? 'FOR' : t === 'produtos' ? 'PRO' : 'SER';
    db[t].push({
      ...form,
      id: prefix + String(Date.now()).slice(-6),
      codigo: String(Date.now()).slice(-8).toUpperCase(),
      vinculado: false,
      liquido: Number(form.valor || 0),
      reciboId: form.recibo || ''
    });
  }
  fecharModal();
  render();
  notice('Cadastro salvo na demonstração.');
}
function researchSupplier() {
  const fields = el('edit-form')?.elements;
  if (!fields?.nome) return;
  const nome = fields.nome.value.trim();
  if (!nome) {
    el('form-error').innerHTML = '<p class="error">Informe o nome para pesquisar.</p>';
    return;
  }
  if (nome.toLocaleLowerCase('pt-BR').includes('sem resultado')) {
    el('form-error').innerHTML = '<p class="error">Simulação de HTTP 404: a pesquisa não encontrou informações utilizáveis. O formulário foi preservado.</p>';
    return;
  }
  if (!fields.razao.value.trim()) fields.razao.value = 'Empresa de Demonstração TCC';
  if (!fields.documento.value.trim()) fields.documento.value = '00.000.000/0001-00';
  if (!fields.telefone.value.trim()) fields.telefone.value = '(00) 0000-0000';
  if (!fields.endereco.value.trim()) fields.endereco.value = 'Endereço fictício para demonstração';
  el('form-error').innerHTML = '<p class="success">Pesquisa simulada pelo nome. Campos existentes foram preservados. Confira antes de Salvar.</p>';
}
function removeItem(t, id) {
  const item = db[t].find(x => x.id === id);
  if (!item) return;
  if (!confirm(`Excluir ${item.nome}? Esta ação não pode ser desfeita.`)) return;
  if (item.vinculado || item.reciboId) {
    notice('Não é possível excluir: há compras ou itens vinculados a este cadastro.', true);
    return;
  }
  db[t] = db[t].filter(x => x.id !== id);
  render();
  notice('Cadastro excluído na demonstração.');
}
function processFiles() {

  }
  const files = el('files') ? [...el('files').files] : [];
  if (files.some(f => !f.size || f.size > 50 * 1024 * 1024)) {
    notice('O arquivo deve conter dados e ter até 50 MB.', true);
    return;
  }
  const id = 'REC' + String(Date.now()).slice(-6);
  db.recibos.unshift({
    id, codigo: id.slice(-8).toUpperCase(), data: new Date().toLocaleDateString('pt-BR'),
    dataCompra: new Date().toLocaleDateString('pt-BR'), arquivo: arquivosLocais.join(', '),
    status:'Processando', total:50, subtotal:50, descontos:0, acrescimos:0,
    fornecedorId:'FOR001', tipoDoc:'Recibo', tipoItem:'Produto',
    extracao:'Aguardando extração dos dados do documento...', paginas:1, pagamento:'', telefone:'', endereco:''
  });
  arquivosLocais = [];
  qrVisivel = false;
  go('recibos');
  setTimeout(() => {
    const r = recibo(id);
    if (r) {
      r.status = 'Processado';
      r.extracao = 'Dados extraídos.';
      if (['recibos','compras','dashboard'].includes(route)) {
        render();
        notice('Processamento simulado concluído. Confira a compra em Visualizar.');
      }
    }
  }, 700);
}
function detail(id) {
  const r = recibo(id);
  if (!r) return;
  const f = fornecedor(r.fornecedorId);
  const itens = [...db.produtos, ...db.servicos].filter(p => p.reciboId === id);
  editing = null;
  el('modal-title').textContent = 'Compra ' + r.codigo;
  el('modal-help').textContent = 'Dados fictícios para validar a navegação. O protótipo não executa OCR.';
  el('modal-body').innerHTML = `
    <p><strong>Fornecedor</strong> · ${esc(f?.nome ?? '—')}</p>
    <p><strong>Arquivo</strong> · ${esc(r.arquivo)}</p>
    <p><strong>Tipo</strong> · ${esc(r.tipoDoc)} · ${esc(r.tipoItem)}</p>
    ${table(['Item','Quantidade','Unitário','Total'], itens.length ? itens.map(p => [esc(p.nome),'1', brl(p.valor), brl(p.liquido)]) : [['Item demonstrativo','1', brl(r.total), brl(r.total)]])}
    <p><strong>Total ${brl(r.total)}</strong></p>
    <div class="acoes-linha" style="margin-top:16px">
      <button class="danger" type="button" onclick="fecharModal();excluirRecibo('${id}')">Excluir</button>
      <button type="button" onclick="fecharModal()">Fechar</button>
    </div>`;
  el('editor').showModal();
}
function csv() {
  const rows = [['Recibo','Fornecedor','Total'], ...db.recibos.map(r => [r.codigo, fornecedor(r.fornecedorId)?.nome ?? '', r.total])];
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(c => '"' + String(c).replaceAll('"','""') + '"').join(';')).join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'relatorio-demonstracao.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
el('wire').onclick = () => {
  document.body.classList.toggle('wire');
  el('wire').textContent = document.body.classList.contains('wire') ? 'Visual da aplicação' : 'Wireframe';
};
el('reset').onclick = () => {
  db = JSON.parse(JSON.stringify(initial));
  edicoesFornecedor = {};
  arquivosLocais = [];
  qrVisivel = false;
  tokenApi = '';
  filtroCadastro = '';
  render();
  notice('Dados de demonstração reiniciados.');
};
document.addEventListener('mousedown', fecharMenuFora);
window.onhashchange = render;
window.edit = edit;
window.detail = detail;
window.removeItem = removeItem;
window.editarFornecedor = editarFornecedor;
window.salvarFornecedor = salvarFornecedor;
window.excluirRecibo = excluirRecibo;
window.fecharModal = fecharModal;
if (!location.hash) location.hash = 'dashboard';
else render();
</script>
</body>
</html>
