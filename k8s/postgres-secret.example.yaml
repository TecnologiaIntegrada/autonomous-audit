# Copie para postgres-secret.local.yaml (gitignored) e preencha.
# Nao commite senhas. No cluster, crie o Secret com kubectl a partir deste modelo.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: dotnet
type: Opaque
stringData:
  POSTGRES_USER: "app"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "appdb"
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=appdb;Username=app;Password=REPLACE_ME"
