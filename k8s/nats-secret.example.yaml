# Copie para nats-secret.local.yaml (gitignored) e preencha.
# Gere o htpasswd localmente (nunca versione o hash real):
#   htpasswd -nbB admin SUA_SENHA
apiVersion: v1
kind: Secret
metadata:
  name: nats-secret
  namespace: dotnet
type: Opaque
stringData:
  NATS_USER: "app"
  NATS_PASSWORD: "REPLACE_ME"
  NATS_UI_USER: "admin"
  NATS_UI_PASSWORD: "REPLACE_ME"
  htpasswd: "admin:REPLACE_ME"
  dotnet.json: |
    {"description":"NATS dotnet (JetStream)","url":"nats://nats:4222","user":"app","password":"REPLACE_ME"}
